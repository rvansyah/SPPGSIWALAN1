function authScreen(mode='login',error=''){

 const root=document.createElement('div');root.id='authRoot';root.className='auth-screen';

 <h1>${setup?'Buat Administrator Portal':reg?'Daftar Akun Petugas':'Masuk Portal SPPG'}</h1>

 ${error?`<div class="auth-error">${esc(error)}</div>`:''}
 <form id="authForm">
 ${setup||reg?'<div class="field"><label>Nama lengkap *</label><input name="name" required placeholder="Nama lengkap"></div>':''}
 <div class="field"><label>Email *</label><input name="email" type="email" required placeholder="nama@email.com" autocomplete="username"></div>
 <div class="field"><label>Kata sandi *</label><input name="password" type="password" minlength="6" required placeholder="Minimal 6 karakter" autocomplete="current-password"></div>
 ${setup||reg?'<div class="field"><label>Ulangi kata sandi *</label><input name="confirm" type="password" minlength="6" required></div>':''}
 <button class="btn btn-primary" type="submit">${setup?'Buat Admin Pertama':reg?'Daftar Petugas':'Masuk'}</button></form>
 ${!setup?`<div class="auth-switch">${reg?'Sudah punya akun?':'Petugas baru?'} <button id="authToggle">${reg?'Masuk':'Daftar petugas'}</button></div>`:''}
 <p style="font-size:10px;margin-top:14px">Akun dan data disimpan di Supabase. Jangan bagikan anon key yang bersifat rahasia (service_role key).</p></div>`;
 document.body.appendChild(root);
 document.getElementById('authToggle')?.addEventListener('click',()=>authScreen(reg?'login':'register'));
 document.getElementById('authForm').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password')),name=String(f.get('name')||'').trim();
  const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='Memproses…';
  try{

   if(setup||reg){

    const {data:exists,error:existsErr}=await sb.rpc('sppg_has_admin');if(existsErr)throw existsErr;

   }else{

   }

 };

async function afterAuth(user){

 currentUser={id:user.id,email:user.email,name:profile.full_name||user.user_metadata?.full_name||user.email,role:profile.role};
 const {data:cloud,error}=await sb.from('app_state').select('payload').eq('id',1).maybeSingle();if(error)throw error;
 if(cloud?.payload&&Array.isArray(cloud.payload.items)&&Array.isArray(cloud.payload.transactions))state=cloud.payload;
 else {const {error:upErr}=await sb.from('app_state').upsert({id:1,payload:state,updated_by:user.id});if(upErr)throw upErr;}
 state.beneficiaries=Array.isArray(state.beneficiaries)?state.beneficiaries:[];state.nextBeneficiary=state.nextBeneficiary||1;

 document.getElementById('authRoot')?.remove();document.querySelector('.app').classList.remove('hidden');

}

function importHeaderMap(row){
 const map={};
 Object.keys(row||{}).forEach(k=>{
   const n=String(k).toLowerCase().replace(/[^a-z0-9]+/g,'').trim();
   if(n)map[n]=k;
 });
 return map;
}
function importGet(row,map,aliases){
 for(const a of aliases){
   const k=map[String(a).toLowerCase().replace(/[^a-z0-9]+/g,'').trim()];
   if(k!==undefined)return row[k];
 }
 return '';
}
function importDateValue(v,fallback){
 if(v instanceof Date&&!isNaN(v.getTime()))return v.toISOString().slice(0,10);
 if(typeof v==='number'&&window.XLSX?.SSF){
   const d=XLSX.SSF.parse_date_code(v);
   if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
 }
 const s=String(v??'').trim();
 if(!s)return fallback;
 let m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
 if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
 m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
 if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
 const d=new Date(s);
 return isNaN(d.getTime())?fallback:d.toISOString().slice(0,10);
}
function importStatusActive(v){
 const s=String(v??'').trim().toLowerCase();
 return v===true||s==='true'||s==='aktif'||s==='ya'||s==='1'||s==='menerima';
}
function importSchoolFromFilename(name){
 const base=String(name||'').replace(/\.[^.]+$/,'').replace(/^Penerima[_\-\s]*/i,'').replace(/\s+\(\d+\)$/,'').trim();
 return base||'';
}
async function readBeneficiaryExcel(file,options={}){
 if(!window.XLSX)throw new Error('Pustaka Excel belum termuat. Pastikan perangkat terhubung ke internet lalu coba lagi.');
 const buf=await file.arrayBuffer();
 const wb=XLSX.read(buf,{type:'array',cellDates:true});
 const sheetName=wb.SheetNames.find(s=>/template\s*penerima|penerima/i.test(s))||wb.SheetNames[0];
 const ws=wb.Sheets[sheetName];
 const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
 if(!rows.length)throw new Error('Sheet Excel tidak berisi data.');
 const map=importHeaderMap(rows[0]);
 const hasAppFormat=!!importGet(rows[0],map,['Nama lengkap','Nama','Nama Penerima'])&&!!importGet(rows[0],map,['Sekolah / kelompok','Sekolah','Nama Sekolah']);
 const schoolDefault=String(options.school||'').trim()||importSchoolFromFilename(file.name);
 const defaultPortion=String(options.portion||'BESAR').toUpperCase();
 const defaultDate=options.date||new Date().toISOString().slice(0,10);
 const onlyActive=!!options.onlyActive;
 const result=[];
 let skipped=0;
 rows.forEach((r,idx)=>{
   const name=String(importGet(r,map,['Nama lengkap','Nama Penerima','Nama'])||'').trim();
   if(!name||/^nama lengkap penerima manfaat$/i.test(name))return;
   const activeValue=importGet(r,map,['Status Menerima','Status','Aktif']);
   if(onlyActive && !importStatusActive(activeValue)){skipped++;return;}
   const identity=String(importGet(r,map,['NIK / ID penerima','NIK/ID','NISN/NIK','NIK','NISN','ID penerima'])||'').trim();
   const school=String(importGet(r,map,['Sekolah / kelompok','Sekolah','Nama Sekolah','Kelompok'])||schoolDefault).trim();
   const grade=String(importGet(r,map,['Kelas / kelompok umur','Kelas','Kelompok Umur','Kelompok umur'])||'').trim();
   let portion=String(importGet(r,map,['Jenis porsi','Porsi','Jenis Porsi'])||defaultPortion).trim().toUpperCase();
   if(!['2B','KECIL','BESAR','BALITA'].includes(portion))portion=defaultPortion;
   const date=importDateValue(importGet(r,map,['Tanggal penyaluran','Tanggal Penyaluran','Tanggal'])||'',defaultDate);
   const birth=String(importGet(r,map,['Tanggal Lahir','Tanggal lahir'])||'').trim();
   const parent=String(importGet(r,map,['Nama Orang Tua','Nama orang tua','Orang Tua','Wali'])||'').trim();
   const position=String(importGet(r,map,['Posisi'])||'').trim();
   const status=String(activeValue??'').trim();
   const noteParts=[];
   if(birth)noteParts.push('Tanggal lahir: '+birth);
   if(parent)noteParts.push('Orang tua/wali: '+parent);
   if(position)noteParts.push('Posisi: '+position);
   if(status)noteParts.push('Status menerima: '+status);
   const noteExisting=String(importGet(r,map,['Keterangan','Catatan','Note'])||'').trim();
   if(noteExisting)noteParts.push(noteExisting);
   result.push({name,identity,school,grade,portion,date,note:noteParts.join(' | '),sourceRow:idx+2});
 });
 return {rows:result,skipped,sheetName,hasAppFormat};
}
function beneficiaryImportPreview(parsed){
 const rows=parsed?.rows||[];
 const existingIds=new Set(state.beneficiaries.map(x=>String(x.identity||'').trim()).filter(Boolean));
 const existingNameSchool=new Set(state.beneficiaries.map(x=>(String(x.name||'').trim().toLowerCase()+'|'+String(x.school||'').trim().toLowerCase())));
 let dup=0;
 rows.forEach(d=>{const idKey=String(d.identity||'').trim();const ns=String(d.name).trim().toLowerCase()+'|'+String(d.school).trim().toLowerCase();if((idKey&&existingIds.has(idKey))||existingNameSchool.has(ns))dup++;});
 const sample=rows.slice(0,8);
 return `<div style="font-size:12px;line-height:1.7"><b>${rows.length}</b> baris siap diproses · <b>${dup}</b> duplikat akan dilewati${parsed.skipped?` · <b>${parsed.skipped}</b> baris nonaktif dilewati`:''}.<br>Sheet: <b>${esc(parsed.sheetName)}</b> · ${parsed.hasAppFormat?'Format aplikasi terdeteksi':'Format data penerima terdeteksi'}</div>${sample.length?`<div class="table-wrap" style="margin-top:10px;max-height:220px"><table style="min-width:700px"><thead><tr><th>Nama</th><th>NIK / ID</th><th>Sekolah</th><th>Kelas</th><th>Porsi</th><th>Tanggal</th></tr></thead><tbody>${sample.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.identity||'-')}</td><td>${esc(d.school||'-')}</td><td>${esc(d.grade||'-')}</td><td>${esc(d.portion)}</td><td>${dateFmt(d.date)}</td></tr>`).join('')}</tbody></table></div>${rows.length>sample.length?`<div style="margin-top:6px;color:#8b96a6;font-size:10px">Menampilkan 8 baris pertama sebagai pratinjau.</div>`:''}`:''}`;
}
function beneficiaryImportModal(){
 if(!window.XLSX){toast('Pustaka Excel belum termuat. Pastikan internet aktif.');return;}
 const today=new Date().toISOString().slice(0,10);
 const defaultSchool='';
 openModal('Import Penerima Manfaat dari Excel',`<div class="notice" style="margin-top:0">Excel dapat memakai <b>format aplikasi</b> (7 kolom sesuai form) atau format data sekolah: <b>NISN/NIK, Nama Penerima, Tanggal Lahir, Jenis Kelamin ID, Nama Orang Tua, Posisi, Status Menerima</b>. Jika kolom sekolah tidak ada, aplikasi memakai nama file atau sekolah default.</div>
 <form id="beneficiaryImportForm"><div class="form-grid">
 <div class="field full"><label>File Excel *</label><input id="beneficiaryExcelFile" type="file" accept=".xlsx,.xls,.csv" required></div>
 <div class="field"><label>Sekolah / kelompok default</label><input id="importSchool" value="${esc(defaultSchool)}" placeholder="Contoh: SDN 01 Tengengkulon"></div>
 <div class="field"><label>Porsi default jika kolom porsi tidak ada</label><select id="importPortion"><option>2B</option><option>KECIL</option><option selected>BESAR</option><option>BALITA</option></select></div>
 <div class="field"><label>Tanggal penyaluran default</label><input id="importDate" type="date" value="${today}"></div>
 <div class="field" style="justify-content:center"><label style="display:flex;align-items:center;gap:8px"><input id="importOnlyActive" type="checkbox" checked style="width:auto"> Hanya import yang aktif menerima</label></div>
 </div>
 <div id="importPreview" class="notice">Pilih file Excel untuk membaca dan memeriksa data sebelum disimpan.</div>
 <div class="form-actions"><button type="button" class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" type="submit" id="importSubmit" disabled>Import & Simpan</button></div></form>`);
 const fileEl=document.getElementById('beneficiaryExcelFile');
 const preview=document.getElementById('importPreview');
 let parsed=null;
 const parse=async()=>{
   const file=fileEl.files[0];if(!file){parsed=null;return;}
   preview.textContent='Membaca file Excel…';document.getElementById('importSubmit').disabled=true;
   try{
     parsed=await readBeneficiaryExcel(file,{school:document.getElementById('importSchool').value,portion:document.getElementById('importPortion').value,date:document.getElementById('importDate').value,onlyActive:document.getElementById('importOnlyActive').checked});
     preview.innerHTML=beneficiaryImportPreview(parsed);document.getElementById('importSubmit').disabled=!parsed.rows.length;
   }catch(err){parsed=null;preview.textContent=err.message||'File Excel tidak dapat dibaca.';}
 };
 fileEl.addEventListener('change',parse);
 ['importSchool','importPortion','importDate','importOnlyActive'].forEach(id=>document.getElementById(id).addEventListener('change',parse));
 document.getElementById('beneficiaryImportForm').onsubmit=async e=>{
   e.preventDefault();
   const file=fileEl.files[0];if(!file)return;
   const submit=document.getElementById('importSubmit');submit.disabled=true;submit.textContent='Mengimport…';
   try{
     const opts={school:document.getElementById('importSchool').value,portion:document.getElementById('importPortion').value,date:document.getElementById('importDate').value,onlyActive:document.getElementById('importOnlyActive').checked};
     parsed=await readBeneficiaryExcel(file,opts);
     let added=0,duplicates=0;
     const existingIds=new Set(state.beneficiaries.map(x=>String(x.identity||'').trim()).filter(Boolean));
     const existingNameSchool=new Set(state.beneficiaries.map(x=>(String(x.name||'').trim().toLowerCase()+'|'+String(x.school||'').trim().toLowerCase())));
     parsed.rows.forEach(d=>{
       const idKey=String(d.identity||'').trim();
       const nameSchool=String(d.name).trim().toLowerCase()+'|'+String(d.school).trim().toLowerCase();
       if((idKey&&existingIds.has(idKey))||existingNameSchool.has(nameSchool)){duplicates++;return;}
       state.beneficiaries.push({id:'PM-'+String(state.nextBeneficiary++).padStart(4,'0'),...d});
       if(idKey)existingIds.add(idKey);existingNameSchool.add(nameSchool);added++;
     });
     await save();closeModal();render();toast(`Import selesai: ${added} ditambahkan${duplicates?`, ${duplicates} duplikat dilewati`:''}.`);
   }catch(err){submit.disabled=false;submit.textContent='Import & Simpan';preview.textContent=err.message||'Import gagal.';}
 };
}

function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}

function normalizeStockName(v){
 return String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function parseNumber(v){
 if(v===null||v===undefined||v==='') return NaN;
 let s=String(v).trim().replace(/\s/g,'');
 if(s.includes(',') && s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
 else if(s.includes(',')) s=s.replace(',','.');
 return Number(s);
}
function nextTxId(){return 'TRX-'+String(state.nextTx++).padStart(4,'0')}
function stockTransactionPreview(rows,source){
 const valid=rows.map(r=>({...r,name:String(r.name||'').trim(),qty:parseNumber(r.qty),unit:String(r.unit||'').trim().toUpperCase()}))
 .filter(r=>r.name && Number.isFinite(r.qty));
 const matched=[],newItems=[];
 valid.forEach(r=>{
   const x=state.items.find(i=>normalizeStockName(i.name)===normalizeStockName(r.name));
   if(x){
     const diff=Number((r.qty-x.stock).toFixed(3));
     if(Math.abs(diff)>0.000001) matched.push({row:r,item:x,diff});
   }else newItems.push({row:r});
 });
 return {valid,matched,newItems,source};
}
function importStockRows(rows,source){
 const p=stockTransactionPreview(rows,source);
 let html=`<div class="notice"><strong>${p.source}</strong><br>Ditemukan ${p.valid.length} baris bahan. ${p.matched.length} akan dicatat sebagai transaksi karena stok berbeda.${p.newItems.length?` ${p.newItems.length} bahan belum ada di aplikasi dan akan ditambahkan sebagai <b>Barang Masuk</b>.`:''}</div>`;
 if(!p.matched.length&&!p.newItems.length){
   html+=`<div class="notice">✓ Tidak ada perbedaan stok. Tidak ada transaksi baru yang dibuat.</div>`;
 }else{
   const rowsHtml=[...p.matched.map(v=>`<tr><td>${esc(v.item.name)}</td><td>${fmt(v.item.stock)} ${esc(v.item.unit)}</td><td>${fmt(v.row.qty)} ${esc(v.row.unit||v.item.unit)}</td><td><strong>${v.diff>0?'Barang Masuk':'Barang Keluar'}</strong></td><td>${fmt(Math.abs(v.diff))} ${esc(v.row.unit||v.item.unit)}</td></tr>`),
   ...p.newItems.map(v=>`<tr><td>${esc(v.row.name)}</td><td>—</td><td>${fmt(v.row.qty)} ${esc(v.row.unit)}</td><td><strong>Barang Masuk</strong></td><td>${fmt(v.row.qty)} ${esc(v.row.unit)}</td></tr>`)].join('');
   html+=`<div class="table-wrap"><table><thead><tr><th>Bahan</th><th>Stok Aplikasi</th><th>Stok Excel/Gambar</th><th>Transaksi</th><th>Jumlah</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
 }
 html+=`<div class="form-actions"><button class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" id="applyStockImport" ${(!p.matched.length&&!p.newItems.length)?'disabled':''}>✓ Catat Transaksi</button></div>`;
 openModal('Hasil Perbandingan Stok',html);
 document.getElementById('applyStockImport')?.addEventListener('click',()=>{
   let added=0,changed=0;
   p.matched.forEach(v=>{
     const x=v.item,diff=v.diff,type=diff>0?'Masuk':'Keluar',qty=Math.abs(diff),before=x.stock;
     x.stock=Number((x.stock+diff).toFixed(3));
     state.transactions.push({id:nextTxId(),date:new Date().toISOString().slice(0,10),itemId:x.id,type,qty,price:Number(x.price||0),note:`Import ${source}: penyesuaian stok ${fmt(v.row.qty)} ${v.row.unit||x.unit}`,before,after:x.stock});
     changed++;
   });
   p.newItems.forEach(v=>{
     const r=v.row, newid='BHN-'+String(state.nextItem++).padStart(3,'0');
     const unit=(r.unit||'pcs').toLowerCase();
     const x={id:newid,name:r.name,category:'Lainnya',unit,price:0,opening:0,stock:0,min:0,note:`Ditambahkan dari import ${source}`};
     state.items.push(x);
     const qty=r.qty,before=0;x.stock=Number(qty.toFixed(3));
     state.transactions.push({id:nextTxId(),date:new Date().toISOString().slice(0,10),itemId:x.id,type:'Masuk',qty,price:0,note:`Import ${source}: bahan baru`,before,after:x.stock});
     added++;
   });
   save();closeModal();render();toast(`Import selesai: ${changed+added} transaksi dicatat`);
 });
}
function stockImportExcelModal(){
 openModal('Import Excel untuk Transaksi Stok',`<div class="notice">Pilih file Excel stok. Aplikasi akan membandingkan <b>nama bahan + stok</b> dengan data saat ini. Contoh: Garam 26 di aplikasi, Garam 33 di Excel → otomatis dicatat <b>Barang Masuk 7</b>. Jika 33 di aplikasi dan 26 di Excel → <b>Barang Keluar 7</b>.</div>
 <div class="field"><label>File Excel (.xlsx / .xls)</label><input id="stockExcelFile" type="file" accept=".xlsx,.xls"></div>
 <div id="stockExcelStatus" class="notice">Belum ada file dipilih.</div>
 <div class="form-actions"><button class="btn" data-action="close-modal">Batal</button></div>`);
 document.getElementById('stockExcelFile').addEventListener('change',async e=>{
   const file=e.target.files[0];if(!file)return;
   const st=document.getElementById('stockExcelStatus');st.textContent='Membaca Excel...';
   try{
     const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'});let rows=[];
     wb.SheetNames.forEach(sn=>{
       const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
       let header=-1,ni=-1,si=-1,ui=-1;
       for(let i=0;i<a.length;i++){
         const cells=a[i].map(v=>String(v).trim().toLowerCase());
         const b=cells.findIndex(v=>v.includes('bahan baku')||v==='bahan'||v.includes('nama bahan'));
         const s=cells.findIndex(v=>v==='stock'||v==='stok'||v.includes('stock')||v.includes('stok'));
         if(b>=0&&s>=0){header=i;ni=b;si=s;ui=cells.findIndex(v=>v==='satuan'||v.includes('unit'));break}
       }
       if(header>=0){
         for(let i=header+1;i<a.length;i++){const r=a[i];const name=String(r[ni]??'').trim();const qty=parseNumber(r[si]);if(name&&Number.isFinite(qty))rows.push({name,qty,unit:ui>=0?String(r[ui]||'').trim():''});}
       }
     });
     if(!rows.length)throw Error('Kolom Bahan Baku dan Stock/Stok tidak ditemukan.');
     importStockRows(rows,'Excel');
   }catch(err){st.textContent='Gagal membaca Excel: '+err.message}
 });
}
function parseOcrStock(text){
 const rows=[];
 String(text||'').split(/\r?\n/).map(s=>s.replace(/\|/g,' ').replace(/\t+/g,' ').replace(/\s+/g,' ').trim()).forEach(line=>{
   if(!line||/bahan\s*baku|stock|stok|satuan|no\b/i.test(line)&&!/\d/.test(line))return;
   line=line.replace(/^[#*]?\s*\d+\s*[\.\)\-:]\s*/,'').trim();
   let m=line.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*([A-Za-z]+)?\s*$/);
   if(m){const name=m[1].trim().replace(/\s+/g,' ');if(name&&!/^(NO|NAMA)$/i.test(name))rows.push({name,qty:parseNumber(m[2]),unit:m[3]||''});}
 });
 const seen={};return rows.filter(r=>{const k=normalizeStockName(r.name);if(seen[k])return false;seen[k]=1;return true});
}

document.getElementById('modalRoot').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,type=b.dataset.type;if(a==='close-modal')closeModal();if(a==='transaction'){closeModal();transactionForm(id||'',type||'Masuk')}if(a==='edit-item'){const x=item(id);closeModal();if(x)itemForm(x)}if(a==='edit-beneficiary'){const x=state.beneficiaries.find(v=>v.id===id);closeModal();if(x)beneficiaryForm(x)}if(a==='beneficiary-detail'){closeModal();beneficiaryDetail(id)}});
document.getElementById('content').addEventListener('change',e=>{if(e.target.matches('.item-select')){const id=e.target.dataset.itemId;if(e.target.checked)selectedItemIds.add(id);else selectedItemIds.delete(id);render()}if(e.target.id==='selectAllItems'||e.target.id==='selectAllItemsHead'){const arr=state.items.filter(x=>(x.name+' '+x.id+' '+x.category).toLowerCase().includes(searchTerm.toLowerCase())&&(categoryFilter==='Semua kategori'||x.category===categoryFilter));if(e.target.checked)arr.forEach(x=>selectedItemIds.add(x.id));else arr.forEach(x=>selectedItemIds.delete(x.id));render()}});
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;searchTerm='';render();document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')}));
document.getElementById('content').addEventListener('input',e=>{if(e.target.id==='itemSearch'){searchTerm=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('itemSearch');el.focus();el.setSelectionRange(pos,pos)}if(e.target.id==='beneficiarySearch'){searchTerm=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('beneficiarySearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}if(e.target.id==='txSearch'){searchTerm=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('txSearch');el.focus();el.setSelectionRange(pos,pos)}});
document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='categoryFilter'){categoryFilter=e.target.value;render()}if(e.target.id==='itemSort'){itemSort=e.target.value;render()}if(e.target.id==='txFilter'){txFilter=e.target.value;render()}});
document.getElementById('hamburger').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('show')};document.getElementById('shade').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')};
document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.items)||!Array.isArray(d.transactions))throw Error();if(confirm('Pulihkan data dari file ini? Data saat ini akan diganti.')){state=d;save();render();toast('Data berhasil dipulihkan')}}catch(err){alert('File cadangan tidak valid.')}e.target.value=''};reader.readAsText(file)};
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.body.style.background=dark?'#101827':'var(--bg)';document.body.style.color=dark?'#e7edf7':'var(--text)';document.querySelectorAll('.panel,.stat,.topbar,.modal,.quick,.btn:not(.btn-primary):not(.btn-dark),.search,.select').forEach(el=>{el.style.background=dark?'#1c293c':'';el.style.color=dark?'#e7edf7':'';el.style.borderColor=dark?'#34445b':''});document.getElementById('themeBtn').innerHTML='<span class="nav-icon">'+(dark?'☀':'☾')+'</span>'+(dark?'Mode Terang':'Mode Gelap')};
document.getElementById('logoutBtn').onclick=()=>{currentUser=null;authScreen('login')};
document.getElementById('manageAccountsBtn').onclick=manageAccounts;
document.getElementById('modalRoot').addEventListener('click',e=>{const b=e.target.closest('[data-action="remove-account"]');if(b)toast('Kelola penghapusan akun melalui Supabase Dashboard.');});
startGoogleAutoSync();
(async()=>{try{const sb=getSupabase();const {data}=await sb.auth.getSession();if(data.session)await afterAuth(data.session.user);else{const {data:hasAdmin,error}=await sb.rpc('sppg_has_admin');if(error)authScreen('setup','Konfigurasi belum lengkap. Pastikan supabase-config.js dan supabase/schema.sql sudah dipasang.');else authScreen(hasAdmin?'login':'setup');}}catch(e){authScreen('setup',e.message||'Konfigurasi Supabase belum benar.');}})();

</script>
